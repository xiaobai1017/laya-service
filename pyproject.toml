[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layaservice"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.6",
  "laya",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
laya = { path = "laya-upstream" }

[tool.setuptools]
packages = ["app"]
